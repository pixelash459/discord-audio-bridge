name: app-shell

on:
  push:
    branches: [main]
    paths:
      - 'desktop/TauriApp/**'
      - 'scripts/**'
      - 'src/**'
      - 'web/**'
      - 'remote/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-shell.yml'
  pull_request:
    paths:
      - 'desktop/TauriApp/**'
      - 'scripts/**'
      - 'src/**'
      - 'web/**'
      - 'remote/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-shell.yml'
  workflow_dispatch:

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/TauriApp
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      # Installer is self-contained: setup asks for the token, saves it, and starts the bundled
      # bridge. Node 26 is required to build the single-executable bridge.
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 26

      - name: Build and stage the bridge payload
        working-directory: .
        run: |
          npm ci --no-fund --no-audit
          node scripts/package.mjs
          node -e "
            const fs = require('fs');
            const src = 'dist/stage/discord-audio-bridge';
            const dest = 'desktop/TauriApp/src-tauri/bridge-payload';
            fs.rmSync(dest, { recursive: true, force: true });
            fs.cpSync(src, dest, { recursive: true });
            console.log(fs.readdirSync(dest).join('\n'));
          "

      - name: Install npm dependencies
        run: npm ci

      - name: Build the app shell
        run: npx tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: discord-audio-bridge-app-windows
          path: |
            desktop/TauriApp/src-tauri/target/release/bundle/**/*.exe
            desktop/TauriApp/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
