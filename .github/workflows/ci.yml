name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bot half is platform-independent to check, so this runs on Linux where runners are
  # cheapest — twice: on the oldest Node the bot supports (runtime type stripping) and current.
  check:
    name: Bot (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Validate browser interfaces
        run: npm run lint:web

      - name: Verify the sources actually load and the pacer keeps real time
        run: npm run smoke

      - name: Exercise authenticated HTTP and WebSocket boundaries
        shell: bash
        run: |
          export BRIDGE_RUNTIME_ROOT="$RUNNER_TEMP/bridge-http-smoke"
          export CONTROL_PORT=18787
          export REMOTE_HOST=127.0.0.1
          export REMOTE_PORT=18788
          export REMOTE_TOKEN=integration-test-remote-token-123456
          export REMOTE_TRUST_TAILSCALE=false
          node src/index.ts > "$RUNNER_TEMP/bridge-http-smoke.log" 2>&1 &
          bridge_pid=$!
          trap 'kill -INT "$bridge_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            test -f "$BRIDGE_RUNTIME_ROOT/.control-token" && break
            sleep 0.1
          done
          export TEST_CONTROL_TOKEN="$(node -p "JSON.parse(require('fs').readFileSync(process.env.BRIDGE_RUNTIME_ROOT + '/.control-token')).token")"
          export TEST_REMOTE_TOKEN="$REMOTE_TOKEN"
          npm run smoke:http || { cat "$RUNNER_TEMP/bridge-http-smoke.log"; exit 1; }

  # AudioTap and the desktop shell are Windows-only by construction.
  native:
    name: Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build AudioTap
        run: dotnet build native/AudioTap/AudioTap.csproj -c Release --nologo -warnaserror

      - name: Build the desktop app
        run: dotnet build desktop/BridgeApp/BridgeApp.csproj -c Release --nologo -warnaserror

      - name: Smoke test AudioTap
        # No audio device on a CI runner, so enumeration returning an empty list is a pass;
        # what matters is that the binary starts and emits valid JSON.
        run: |
          $output = dotnet run --project native/AudioTap/AudioTap.csproj -c Release --no-build -- --list-devices
          Write-Host "devices: $output"
          $null = $output | ConvertFrom-Json
          Write-Host "AudioTap produced valid JSON"
        shell: pwsh

      # Catches shell scripts that would fail the moment a contributor ran them.
      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($_.Name)::$($errors -join '; ')"
              $failed = $true
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  # One package per OS/arch. The executable embeds a Node runtime, so each target builds on its
  # own runner: SEA generation is native-only by design (a build artifact of the host binary).
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
            nfpm-arch: x86_64
            appimage-arch: x86_64
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            appimage_runtime_sha256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
          - name: linux-arm64
            os: ubuntu-24.04-arm
            nfpm-arch: arm64
            appimage-arch: aarch64
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            appimage_runtime_sha256: 7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The bot runs on 22.18+, but building single executables needs --build-sea (Node 26+).
          node-version: '26'
          cache: npm

      - run: npm ci

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'

      - name: Build AudioTap
        if: runner.os == 'Windows'
        run: npm run build:native
        shell: pwsh

      - name: Regenerate the icon (proves the generator still runs)
        run: node scripts/gen-icon.mjs

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: |
          download_dir="$(mktemp -d)"
          archive="$download_dir/nfpm.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_${{ matrix.nfpm-arch }}.tar.gz"
          echo "${{ matrix.nfpm_sha256 }}  $archive" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin nfpm
          nfpm --version

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          download_dir="$(mktemp -d)"
          tool="$download_dir/appimagetool"
          runtime="$RUNNER_TEMP/appimage-runtime-${{ matrix.appimage-arch }}"
          curl -fsSL -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.appimage-arch }}.AppImage"
          echo "${{ matrix.appimagetool_sha256 }}  $tool" | sha256sum --check --strict
          curl -fsSL -o "$runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.appimage-arch }}"
          echo "${{ matrix.appimage_runtime_sha256 }}  $runtime" | sha256sum --check --strict
          sudo install -m 0755 "$tool" /usr/local/bin/appimagetool
          echo "APPIMAGE_RUNTIME_PATH=$runtime" >> "$GITHUB_ENV"
          appimagetool --appimage-extract-and-run --version

      - name: Package
        run: npm run package

      - name: Verify Linux desktop package layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/deb-root
          dpkg-deb --extract dist/release/*.deb dist/deb-root
          desktop=dist/deb-root/usr/share/applications/io.github.ashutoshchaudhary_lgtm.discord-audio-bridge.desktop
          metainfo=dist/deb-root/usr/share/metainfo/io.github.ashutoshchaudhary_lgtm.discord-audio-bridge.appdata.xml
          wrapper=dist/deb-root/usr/bin/discord-audio-bridge
          test -f "$desktop"
          test -f "$metainfo"
          test -x "$wrapper"
          grep -qx 'Exec=/usr/bin/discord-audio-bridge --open' "$desktop"
          grep -qx 'Terminal=false' "$desktop"
          grep -q '<launchable type="desktop-id">io.github.ashutoshchaudhary_lgtm.discord-audio-bridge.desktop</launchable>' "$metainfo"
          grep -q 'BRIDGE_RUNTIME_ROOT=' "$wrapper"
          test -f dist/release/*.AppImage

      - name: Sanity-check the executable
        shell: bash
        run: |
          exe="dist/stage/discord-audio-bridge/discord-audio-bridge"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" --doctor > doctor.log 2>&1 || { cat doctor.log; exit 1; }
          grep -q "ffmpeg" doctor.log
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/stage/discord-audio-bridge/AudioTap.exe --list-devices > devices.json
            node -e "JSON.parse(require('fs').readFileSync('devices.json', 'utf8'))"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  # A tag (v1.2.3) publishes every matrix artifact as a GitHub Release.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: dist/release
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/release/
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "discord-audio-bridge ${GITHUB_REF_NAME}" \
            --generate-notes
