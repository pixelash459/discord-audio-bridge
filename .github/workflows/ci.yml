name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck and smoke tests are platform-light; ubuntu runners are cheapest for Node.
  check:
    name: Bot (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Validate browser interfaces
        run: npm run lint:web

      - name: Verify the sources actually load
        run: npm run smoke

      - name: Exercise authenticated HTTP and WebSocket boundaries
        shell: bash
        run: |
          export BRIDGE_RUNTIME_ROOT="$RUNNER_TEMP/bridge-http-smoke"
          export CONTROL_PORT=18787
          export REMOTE_HOST=127.0.0.1
          export REMOTE_PORT=18788
          export REMOTE_TOKEN=integration-test-remote-token-123456
          export REMOTE_TRUST_TAILSCALE=false
          node src/index.ts > "$RUNNER_TEMP/bridge-http-smoke.log" 2>&1 &
          bridge_pid=$!
          trap 'kill -INT "$bridge_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            test -f "$BRIDGE_RUNTIME_ROOT/.control-token" && break
            sleep 0.1
          done
          export TEST_CONTROL_TOKEN="$(node -p "JSON.parse(require('fs').readFileSync(process.env.BRIDGE_RUNTIME_ROOT + '/.control-token')).token")"
          export TEST_REMOTE_TOKEN="$REMOTE_TOKEN"
          npm run smoke:http || { cat "$RUNNER_TEMP/bridge-http-smoke.log"; exit 1; }

  native:
    name: Native (Windows)
    # Windows runners are the slow half of this workflow, and on a src/ or web/ commit they
    # re-prove what the Ubuntu check job already covered. Run them where the answer can still
    # change something: on pull requests, on the version tags that build a release, and on a
    # manual dispatch when you want a full pass before tagging.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build AudioTap
        run: dotnet build native/AudioTap/AudioTap.csproj -c Release --nologo -warnaserror

      - name: Build the desktop app
        run: dotnet build desktop/BridgeApp/BridgeApp.csproj -c Release --nologo -warnaserror

      - name: Smoke test AudioTap
        # No audio device on a CI runner, so enumeration returning an empty list is a pass;
        # what matters is that the binary starts and emits valid JSON.
        run: |
          $output = dotnet run --project native/AudioTap/AudioTap.csproj -c Release --no-build -- --list-devices
          Write-Host "devices: $output"
          $null = $output | ConvertFrom-Json
          Write-Host "AudioTap produced valid JSON"
        shell: pwsh

      # Catches shell scripts that would fail the moment a contributor ran them.
      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($_.Name)::$($errors -join '; ')"
              $failed = $true
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  package:
    name: Package windows-x64
    # Windows runners are the slow half of this workflow, and on a src/ or web/ commit they
    # re-prove what the Ubuntu check job already covered. Run them where the answer can still
    # change something: on pull requests, on the version tags that build a release, and on a
    # manual dispatch when you want a full pass before tagging.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The bot runs on 22.18+, but building single executables needs --build-sea (Node 26+).
          node-version: '26'
          cache: npm

      - run: npm ci

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build AudioTap
        run: npm run build:native
        shell: pwsh

      - name: Regenerate the icon (proves the generator still runs)
        run: node scripts/gen-icon.mjs

      - name: Package
        run: npm run package

      - name: Sanity-check the executable
        shell: bash
        run: |
          exe="dist/stage/discord-audio-bridge/discord-audio-bridge.exe"
          "$exe" --version
          "$exe" --doctor > doctor.log 2>&1 || { cat doctor.log; exit 1; }
          grep -q "ffmpeg" doctor.log
          dist/stage/discord-audio-bridge/AudioTap.exe --list-devices > devices.json
          node -e "JSON.parse(require('fs').readFileSync('devices.json', 'utf8'))"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-windows-x64
          path: dist/release/*
          if-no-files-found: error

  # Installers for the Tauri desktop shell. Only on version tags so ordinary CI stays fast;
  # main-branch builds continue to ship via the separate app-shell workflow artifacts.
  app-shell:
    name: App shell (Windows)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/TauriApp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - name: Build and stage the bridge payload
        working-directory: .
        run: |
          npm ci --no-fund --no-audit
          node scripts/package.mjs
          node -e "
            const fs = require('fs');
            const src = 'dist/stage/discord-audio-bridge';
            const dest = 'desktop/TauriApp/src-tauri/bridge-payload';
            fs.rmSync(dest, { recursive: true, force: true });
            fs.cpSync(src, dest, { recursive: true });
            console.log(fs.readdirSync(dest).join('\n'));
          "

      - name: Install npm dependencies
        run: npm ci

      - name: Build the app shell
        run: npx tauri build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discord-audio-bridge-app-windows
          path: |
            desktop/TauriApp/src-tauri/target/release/bundle/**/*.exe
            desktop/TauriApp/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

  # Tag push (v*) publishes Windows ZIP + MSI/NSIS as a GitHub Release — the public download
  # surface. Actions artifacts alone expire and are awkward for end users.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native, package, app-shell]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-windows-x64
          path: dist/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discord-audio-bridge-app-windows
          path: dist/app-shell

      - name: Stage release assets
        run: |
          mkdir -p dist/release
          find dist/app-shell -type f \( -name '*.msi' -o -name '*.exe' \) -print -exec cp -t dist/release {} +
          ls -la dist/release/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "discord-audio-bridge ${GITHUB_REF_NAME}" \
            --generate-notes
