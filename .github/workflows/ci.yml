name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bot half is platform-independent to check, so this runs on Linux where runners are
  # cheapest — twice: on the oldest Node the bot supports (runtime type stripping) and current.
  check:
    name: Bot (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify the sources actually load and the pacer keeps real time
        run: npm run smoke

  # AudioTap and the desktop shell are Windows-only by construction.
  native:
    name: Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build AudioTap
        run: dotnet build native/AudioTap/AudioTap.csproj -c Release --nologo -warnaserror

      - name: Build the desktop app
        run: dotnet build desktop/BridgeApp/BridgeApp.csproj -c Release --nologo -warnaserror

      - name: Smoke test AudioTap
        # No audio device on a CI runner, so enumeration returning an empty list is a pass;
        # what matters is that the binary starts and emits valid JSON.
        run: |
          $output = dotnet run --project native/AudioTap/AudioTap.csproj -c Release --no-build -- --list-devices
          Write-Host "devices: $output"
          $null = $output | ConvertFrom-Json
          Write-Host "AudioTap produced valid JSON"
        shell: pwsh

      # Catches shell scripts that would fail the moment a contributor ran them.
      - name: Parse every script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($_.Name)::$($errors -join '; ')"
              $failed = $true
            } else {
              Write-Host "ok  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  # One package per OS/arch. The executable embeds a Node runtime, so each target builds on its
  # own runner: SEA generation is native-only by design (a build artifact of the host binary).
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
            nfpm-arch: amd64
            appimage-arch: x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            nfpm-arch: arm64
            appimage-arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The bot runs on 22.18+, but building single executables needs --build-sea (Node 26+).
          node-version: '26'
          cache: npm

      - run: npm ci

      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '9.0.x'

      - name: Build AudioTap
        if: runner.os == 'Windows'
        run: npm run build:native
        shell: pwsh

      - name: Regenerate the icon (proves the generator still runs)
        run: node scripts/gen-icon.mjs

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_linux_${{ matrix.nfpm-arch }}.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimage-arch }}.AppImage"
          chmod +x /usr/local/bin/appimagetool
          appimagetool --appimage-extract-and-run --version

      - name: Package
        run: npm run package

      - name: Sanity-check the executable
        shell: bash
        run: |
          exe="dist/stage/discord-audio-bridge/discord-audio-bridge"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" --doctor > doctor.log 2>&1 || { cat doctor.log; exit 1; }
          grep -q "ffmpeg" doctor.log
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/stage/discord-audio-bridge/AudioTap.exe --list-devices > devices.json
            node -e "JSON.parse(require('fs').readFileSync('devices.json', 'utf8'))"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  # A tag (v1.2.3) publishes every matrix artifact as a GitHub Release.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, native, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist/release
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/release/
          gh release create "${GITHUB_REF_NAME}" dist/release/* \
            --title "discord-audio-bridge ${GITHUB_REF_NAME}" \
            --generate-notes
