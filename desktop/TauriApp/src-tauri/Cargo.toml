[package]
name = "discord-audio-bridge-app"
version = "0.1.0"
description = "Desktop shell for discord-audio-bridge: native window, tray, and hotkeys around the bridge control panel"
authors = ["discord-audio-bridge contributors"]
license = "MIT"
repository = "https://github.com/AshutoshChaudhary-lgtm/discord-audio-bridge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "discord_audio_bridge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP for the loopback control API only (127.0.0.1): no TLS stack needed, keep it lean.
ureq = { version = "3", default-features = false, features = ["json"] }
dirs = "6"

[target.'cfg(unix)'.dependencies]
# PR_SET_PDEATHSIG in the bridge child, so it never outlives this shell - even on SIGKILL.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Kill-on-close job object, so the bridge child never outlives this shell - even on a crash.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
